name: Bazel test

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/bazel.yml" # This file
      - ".github/actions/install-gcc-trunk/action.yml"
      - "**/*.cc"
      - "**/*.h"
      - "**/*.hh"
      - "**/*.bazel"
      - "BUILD.bazel"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".bazelrc"
      - ".bazelignore"
      - ".bazelversion"
      - "scripts/bazel.py"
      - "scripts/bazel.sh"
      - "scripts/compiler_discovery.py"
      - "tutorials/BUILD.bazel"
  # No `paths:` filter here. The `bazel` summary job is a required status
  # check for merging to main, and a workflow that is filtered out by
  # `paths:` never reports a check, which leaves unrelated pull requests
  # blocked as "Expected - Waiting for status to be reported". Instead, the
  # `detect-changes` job below decides whether the build needs to run, and
  # the summary job reports a passing check when the build was skipped.
  pull_request:

env:
  UV_FROZEN: 1

jobs:
  detect-changes:
    name: detect-changes (bazel)
    # Only pull requests need change detection; pushes to main and scheduled
    # runs always run the build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with the `push.paths` list above.
          filters: |
            relevant:
              - ".github/workflows/bazel.yml" # This file
              - ".github/actions/install-gcc-trunk/action.yml"
              - "**/*.cc"
              - "**/*.h"
              - "**/*.hh"
              - "**/*.bazel"
              - "BUILD.bazel"
              - "MODULE.bazel"
              - "MODULE.bazel.lock"
              - ".bazelrc"
              - ".bazelignore"
              - ".bazelversion"
              - "scripts/bazel.py"
              - "scripts/bazel.sh"
              - "scripts/compiler_discovery.py"
              - "tutorials/BUILD.bazel"

  build:
    needs: detect-changes
    # `!cancelled()` lets this job run when `detect-changes` was skipped (push
    # and schedule events). When change detection positively reported that
    # nothing relevant changed, every step below is skipped rather than the
    # job itself: a matrix job skipped at job level never expands its matrix
    # and reports a single check under the unexpanded name
    # "${{ matrix.settings.name }}". An empty output (because `detect-changes`
    # failed) falls through to running the build rather than silently passing
    # the required check.
    if: ${{ !cancelled() }}
    name: ${{ matrix.settings.name }}
    runs-on: ${{ matrix.settings.os }}
    continue-on-error: ${{ matrix.settings.compiler.type == 'GCC16_MACOS' }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - {
              name: "GCC trunk",
              os: ubuntu-26.04,
              compiler:
                {
                  type: GCC_TRUNK,
                  version: trunk,
                  cc: "/opt/gcc-latest/bin/gcc",
                  cxx: "/opt/gcc-latest/bin/g++",
                  std: 26,
                },
            }
          # Ubuntu 26.04's gcc-16 is a frozen experimental snapshot whose
          # reflection support no longer receives fixes (issue #122). It is kept
          # because it is what a stock Ubuntu 26.04 user gets from
          # `apt install gcc-16`. Drop this entry once the reflection backend
          # needs fixes that only exist on trunk.
          - {
              name: "GCC-16",
              os: ubuntu-26.04,
              compiler:
                {
                  type: GCC16,
                  version: 16,
                  cc: "gcc-16",
                  cxx: "g++-16",
                  std: 26,
                },
            }
          # Neither the GCC trunk snapshot (a .deb) nor Ubuntu's gcc-16
          # package is available on macOS, so this job gets its reflection
          # compiler from the gcc@16 Homebrew formula instead.
          - {
              name: "GCC-16 (macOS)",
              os: macos-15,
              compiler:
                {
                  type: GCC16_MACOS,
                  version: 16,
                  cc: "gcc-16",
                  cxx: "g++-16",
                  std: 26,
                },
            }
    steps:
      - uses: actions/checkout@v5
        if: needs.detect-changes.outputs.relevant != 'false'
      - name: Install GCC trunk
        if: needs.detect-changes.outputs.relevant != 'false' && matrix.settings.compiler.type == 'GCC_TRUNK'
        # Cached between runs; the action documents how to pin a snapshot.
        uses: ./.github/actions/install-gcc-trunk
      - name: Install GCC 16
        if: needs.detect-changes.outputs.relevant != 'false' && matrix.settings.compiler.type == 'GCC16'
        # Set CXX/CC explicitly so scripts/bazel.py does not pick a stray
        # /opt/gcc-latest on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 g++-16
          echo "CXX=$(which ${{ matrix.settings.compiler.cxx }})" >> "$GITHUB_ENV"
          echo "CC=$(which ${{ matrix.settings.compiler.cc }})" >> "$GITHUB_ENV"
      - name: Install GCC 16 (macOS)
        if: needs.detect-changes.outputs.relevant != 'false' && matrix.settings.compiler.type == 'GCC16_MACOS'
        run: |
          brew install gcc@16
          echo "CXX=$(brew --prefix gcc@16)/bin/${{ matrix.settings.compiler.cxx }}" >> "$GITHUB_ENV"
          echo "CC=$(brew --prefix gcc@16)/bin/${{ matrix.settings.compiler.cc }}" >> "$GITHUB_ENV"
      - name: Install uv
        if: needs.detect-changes.outputs.relevant != 'false'
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        if: needs.detect-changes.outputs.relevant != 'false'
        run: uv sync
      - name: Set up Bazel
        if: needs.detect-changes.outputs.relevant != 'false'
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          # The disk cache is not setup-bazel's `disk-cache`: that saves only
          # when its key, a hash of the BUILD files, misses, so it froze at its
          # first contents and every later run recompiled the same files. The
          # restore and save steps below manage the directory instead, and
          # Bazel's garbage collector bounds what each run carries forward.
          # The collector is an idle task, so a zero delay lets it run as soon
          # as the test command returns.
          bazelrc: |
            build --disk_cache=~/.cache/bazel-disk
            build --experimental_disk_cache_gc_max_size=512M
            build --experimental_disk_cache_gc_idle_delay=0
      - name: Restore the Bazel disk cache
        if: needs.detect-changes.outputs.relevant != 'false'
        id: disk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bazel-disk
          # Every run saves under its own commit and restores the newest cache
          # with a matching prefix, usually the previous run's. One cache per
          # compiler: the entries would not be shared anyway, and parallel
          # jobs saving under one key would race.
          key: bazel-disk-cache-${{ runner.os }}-${{ matrix.settings.compiler.type }}-${{ github.sha }}
          restore-keys: bazel-disk-cache-${{ runner.os }}-${{ matrix.settings.compiler.type }}-
      - name: Run Bazel
        if: needs.detect-changes.outputs.relevant != 'false'
        run: ./scripts/bazel.sh
      - name: Wait for the disk-cache garbage collector
        if: ${{ !cancelled() && needs.detect-changes.outputs.relevant != 'false' }}
        # Shutting down the server waits for the idle-task garbage collector
        # to finish, so the save below never archives a directory that is
        # still being trimmed.
        run: bazel shutdown
      - name: Save the Bazel disk cache
        # Save after a failed build too: its objects are as good as any. Skip
        # when the exact key already existed, which happens on a rerun.
        if: ${{ !cancelled() && needs.detect-changes.outputs.relevant != 'false' && steps.disk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-disk
          key: ${{ steps.disk-cache.outputs.cache-primary-key }}

  # This non-matrix job reports under a fixed name whatever the matrix above
  # did, so the ruleset can require one check per workflow instead of every
  # per-compiler entry.
  summary:
    name: bazel
    needs: [detect-changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the build failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
