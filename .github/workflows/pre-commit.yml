name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

# One group per PR, or per ref for pushes and scheduled runs. A new push to a
# PR cancels the runs for its previous head; main and scheduled runs only queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: 1

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv sync
      - name: Restore the pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
      - name: Run pre-commit
        run: uv run pre-commit run --show-diff-on-failure --color=always --all-files
