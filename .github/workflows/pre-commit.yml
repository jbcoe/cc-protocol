name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

# One group per PR, or per branch for pushes and scheduled runs. A new push to
# a PR cancels the runs for its previous head; pushes to main only queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: 1

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v3
      - uses: pre-commit/action@v3.0.0
