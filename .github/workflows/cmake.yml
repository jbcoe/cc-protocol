name: CMake test

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cmake.yml" # This file
      - ".github/actions/install-gcc-trunk/action.yml"
      - "**/*.cc"
      - "**/*.h"
      - "**/*.hh"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "**/*.cmake"
      - "scripts/cmake.py"
      - "scripts/cmake.sh"
      - "scripts/compiler_discovery.py"
  # No `paths:` filter here. The `cmake` summary job is a required status
  # check for merging to main, and a workflow that is filtered out by
  # `paths:` never reports a check, which leaves unrelated pull requests
  # blocked as "Expected - Waiting for status to be reported". Instead, the
  # `detect-changes` job below decides whether the build needs to run, and
  # the summary job reports a passing check when the build was skipped.
  pull_request:

env:
  UV_FROZEN: 1

jobs:
  detect-changes:
    name: detect-changes (cmake)
    # Only pull requests need change detection; pushes to main and scheduled
    # runs always run the build.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with the `push.paths` list above.
          filters: |
            relevant:
              - ".github/workflows/cmake.yml" # This file
              - ".github/actions/install-gcc-trunk/action.yml"
              - "**/*.cc"
              - "**/*.h"
              - "**/*.hh"
              - "**/CMakeLists.txt"
              - "CMakePresets.json"
              - "**/*.cmake"
              - "scripts/cmake.py"
              - "scripts/cmake.sh"
              - "scripts/compiler_discovery.py"

  build:
    needs: detect-changes
    # `!cancelled()` lets this job run when `detect-changes` was skipped (push
    # and schedule events). When change detection positively reported that
    # nothing relevant changed, every step below is skipped rather than the
    # job itself: a matrix job skipped at job level never expands its matrix
    # and reports a single check under the unexpanded name
    # "${{ matrix.settings.name }} ${{ matrix.configuration }}". An empty
    # output (because `detect-changes` failed) falls through to running the
    # build rather than silently passing the required check.
    if: ${{ !cancelled() }}
    name: ${{ matrix.settings.name }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        configuration: ["Release", "Debug"]
        settings:
          - {
              name: "GCC trunk",
              os: ubuntu-26.04,
              compiler:
                {
                  type: GCC_TRUNK,
                  version: trunk,
                  cc: "/opt/gcc-latest/bin/gcc",
                  cxx: "/opt/gcc-latest/bin/g++",
                  std: 26,
                },
            }
          # Ubuntu 26.04's gcc-16 is a frozen experimental snapshot whose
          # reflection support no longer receives fixes (issue #122). It is kept
          # because it is what a stock Ubuntu 26.04 user gets from
          # `apt install gcc-16`. Drop this entry once the reflection backend
          # needs fixes that only exist on trunk.
          - {
              name: "GCC-16",
              os: ubuntu-26.04,
              compiler:
                {
                  type: GCC16,
                  version: 16,
                  cc: "gcc-16",
                  cxx: "g++-16",
                  std: 26,
                },
            }
    steps:
      - uses: actions/checkout@v5
        if: needs.detect-changes.outputs.relevant != 'false'
      - uses: lukka/get-cmake@v4.4.2
        if: needs.detect-changes.outputs.relevant != 'false'
      - name: Install GCC trunk
        if: needs.detect-changes.outputs.relevant != 'false' && matrix.settings.compiler.type == 'GCC_TRUNK'
        # Cached between runs; the action documents how to pin a snapshot.
        uses: ./.github/actions/install-gcc-trunk
      - name: Install GCC 16
        if: needs.detect-changes.outputs.relevant != 'false' && matrix.settings.compiler.type == 'GCC16'
        # Set CXX/CC explicitly so scripts/cmake.py does not pick a stray
        # /opt/gcc-latest on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 g++-16
          echo "CXX=${{ matrix.settings.compiler.cxx }}" >> "$GITHUB_ENV"
          echo "CC=${{ matrix.settings.compiler.cc }}" >> "$GITHUB_ENV"
      - name: Install uv
        if: needs.detect-changes.outputs.relevant != 'false'
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        if: needs.detect-changes.outputs.relevant != 'false'
        run: uv sync
      - name: Run CMake
        if: needs.detect-changes.outputs.relevant != 'false'
        run: ./scripts/cmake.sh --${{ matrix.configuration == 'Debug' && 'debug' || 'release' }}

  # This non-matrix job reports under a fixed name whatever the matrix above
  # did, so the ruleset can require one check per workflow instead of every
  # per-configuration entry.
  summary:
    name: cmake
    needs: [detect-changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the build failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
