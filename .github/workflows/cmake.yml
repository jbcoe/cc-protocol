name: CMake test

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/cmake.yml" # This file
      - "**/*.cc"
      - "**/*.h"
      - "**/*.hh"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "**/*.cmake"
  pull_request:
    paths:
      - ".github/workflows/cmake.yml" # This file
      - "**/*.cc"
      - "**/*.h"
      - "**/*.hh"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "**/*.cmake"

env:
  UV_FROZEN: 1

jobs:
  build:
    name: ${{ matrix.settings.name }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.settings.os }}
    continue-on-error: ${{ matrix.settings.informational || false }}
    strategy:
      fail-fast: false
      matrix:
        configuration: ["Release", "Debug"]
        settings:
          - {
              name: "Ubuntu GCC-11",
              os: ubuntu-24.04,
              compiler:
                {
                  type: GCC,
                  version: 11,
                  cc: "gcc-11",
                  cxx: "g++-11",
                  std: 20,
                },
              lib: "libstdc++11",
            }
          - {
              name: "Ubuntu GCC-12",
              os: ubuntu-24.04,
              compiler:
                {
                  type: GCC,
                  version: 12,
                  cc: "gcc-12",
                  cxx: "g++-12",
                  std: 20,
                },
              lib: "libstdc++12",
            }
          - {
              name: "Ubuntu GCC-13",
              os: ubuntu-24.04,
              compiler:
                {
                  type: GCC,
                  version: 13,
                  cc: "gcc-13",
                  cxx: "g++-13",
                  std: 20,
                },
              lib: "libstdc++13",
            }
          - {
              name: "Ubuntu GCC-14",
              os: ubuntu-24.04,
              compiler:
                {
                  type: GCC,
                  version: 14,
                  cc: "gcc-14",
                  cxx: "g++-14",
                  std: 20,
                },
              lib: "libstdc++14",
            }
          - {
              name: "Ubuntu GCC-14 (C++23)",
              os: ubuntu-24.04,
              compiler:
                {
                  type: GCC,
                  version: 14,
                  cc: "gcc-14",
                  cxx: "g++-14",
                  std: 23,
                },
              lib: "libstdc++14",
            }
          - {
              name: "Ubuntu Clang-17 + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 17,
                  cc: "clang-17",
                  cxx: "clang++-17",
                  std: 20,
                },
              lib: "libc++17",
            }
          - {
              name: "Ubuntu Clang-18 + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 18,
                  cc: "clang-18",
                  cxx: "clang++-18",
                  std: 20,
                },
              lib: "libc++18",
            }
          - {
              name: "Ubuntu Clang-19 + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 19,
                  cc: "clang-19",
                  cxx: "clang++-19",
                  std: 20,
                },
              lib: "libc++19",
            }
          - {
              name: "Ubuntu Clang-20 + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 20,
                  cc: "clang-20",
                  cxx: "clang++-20",
                  std: 20,
                },
              lib: "libc++20",
            }
          - {
              name: "Ubuntu Clang-21 + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 21,
                  cc: "clang-21",
                  cxx: "clang++-21",
                  std: 20,
                },
              lib: "libc++21",
            }
          - {
              name: "Ubuntu Clang-21 (C++23) + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 21,
                  cc: "clang-21",
                  cxx: "clang++-21",
                  std: 23,
                },
              lib: "libc++21",
            }
          - {
              name: "Ubuntu Clang-22 + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 22,
                  cc: "clang-22",
                  cxx: "clang++-22",
                  std: 20,
                },
              lib: "libc++22",
            }
          - {
              name: "Ubuntu Clang-22 (C++23) + libc++",
              os: ubuntu-24.04,
              compiler:
                {
                  type: CLANG,
                  version: 22,
                  cc: "clang-22",
                  cxx: "clang++-22",
                  std: 23,
                },
              lib: "libc++22",
            }
          - {
              name: "Visual Studio 2019",
              os: windows-latest,
              compiler: { type: VISUAL, version: 16, cc: "cl", cxx: "cl" },
            }
          - {
              name: "Visual Studio 2022 v17",
              os: windows-latest,
              compiler: { type: VISUAL, version: 17, cc: "cl", cxx: "cl" },
            }
          - {
              name: "Visual Studio 2022 v18",
              os: windows-latest,
              compiler: { type: VISUAL, version: 18, cc: "cl", cxx: "cl" },
            }
          - {
              name: "Visual Studio 2022 v19",
              os: windows-latest,
              compiler: { type: VISUAL, version: 19, cc: "cl", cxx: "cl" },
            }
          - {
              name: "MacOS Apple Clang 15",
              os: macos-14,
              compiler:
                {
                  type: APPLE_CLANG,
                  version: "15.0",
                  cc: "clang",
                  cxx: "clang++",
                  std: 20,
                },
            }
          - {
              name: "Ubuntu GCC trunk (C++26 Reflection)",
              os: ubuntu-26.04,
              compiler:
                {
                  type: GCC_TRUNK,
                  version: trunk,
                  cc: "/opt/gcc-latest/bin/gcc",
                  cxx: "/opt/gcc-latest/bin/g++",
                  std: 26,
                },
              reflection: true,
            }
          # Ubuntu 26.04's gcc-16 is a frozen experimental snapshot whose
          # reflection support no longer receives fixes (issue #122). It is kept
          # here as a non-blocking, informational job because it is what a stock
          # Ubuntu 26.04 user gets from `apt install gcc-16`; the GCC trunk job
          # above is the gating one. Drop this entry once the reflection backend
          # needs fixes that only exist on trunk.
          - {
              name: "Ubuntu GCC-16 (C++26 Reflection, informational)",
              os: ubuntu-26.04,
              compiler:
                {
                  type: GCC16,
                  version: 16,
                  cc: "gcc-16",
                  cxx: "g++-16",
                  std: 26,
                },
              reflection: true,
              informational: true,
            }
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@v4.4.2
      - name: Add msbuild to PATH
        if: matrix.settings.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: "16.5"
      - name: Install Latest GCC
        if: matrix.settings.compiler.type == 'GCC'
        uses: egor-tensin/setup-gcc@v1
        with:
          version: ${{ matrix.settings.compiler.version }}
          platform: x64
      - name: Install Clang
        if: matrix.settings.compiler.type == 'CLANG'
        uses: egor-tensin/setup-clang@v1
        with:
          version: ${{ matrix.settings.compiler.version }}
          platform: x64
      - name: Install GCC trunk
        if: matrix.settings.compiler.type == 'GCC_TRUNK'
        # Prebuilt GCC trunk snapshot from https://jwakely.github.io/pkg-gcc-latest/;
        # scripts/cmake.py finds /opt/gcc-latest itself, so no PATH changes are needed.
        # The unversioned URL tracks upstream weekly. If a snapshot regression breaks
        # this job, temporarily pin the versioned file linked from that page, e.g.
        # https://kayari.org/gcc-latest/gcc-latest_17.0.0-20260816git8df013222dff.deb
        run: |
          wget --quiet https://kayari.org/gcc-latest/gcc-latest.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./gcc-latest.deb
      - name: Install GCC 16
        if: matrix.settings.compiler.type == 'GCC16'
        # Set CXX/CC explicitly so scripts/cmake.py does not pick a stray
        # /opt/gcc-latest on the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 g++-16
          echo "CXX=${{ matrix.settings.compiler.cxx }}" >> "$GITHUB_ENV"
          echo "CC=${{ matrix.settings.compiler.cc }}" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv sync
      - name: Run CMake
        run: ./scripts/cmake.sh --${{ matrix.configuration == 'Debug' && 'debug' || 'release' }} ${{ matrix.settings.reflection && '--reflection' || '' }}
