name: Sanitizers

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sanitizers.yml"
      - "**/*.cc"
      - "**/*.h"
      - "**/*.hh"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "**/*.cmake"
      - "scripts/cmake.py"
  pull_request:
    paths:
      - ".github/workflows/sanitizers.yml"
      - "**/*.cc"
      - "**/*.h"
      - "**/*.hh"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "**/*.cmake"
      - "scripts/cmake.py"

env:
  UV_FROZEN: 1

jobs:
  sanitized-tests:
    name: ${{ matrix.sanitizer }} (GCC trunk)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # GCC has no MemorySanitizer, so there is no msan job.
        sanitizer: ["asan", "tsan"]
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@v4.4.2
      - name: Install GCC trunk
        # Prebuilt GCC trunk snapshot from https://jwakely.github.io/pkg-gcc-latest/;
        # scripts/cmake.py finds /opt/gcc-latest itself, so no PATH changes are needed.
        # Keep in sync with the same step in cmake.yml.
        run: |
          wget --quiet https://kayari.org/gcc-latest/gcc-latest.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./gcc-latest.deb
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Set up Python
        run: uv sync
      - name: Run CMake
        run: |
          UBSAN_FLAG=""
          if [ "${{ matrix.sanitizer }}" = "asan" ]; then
            UBSAN_FLAG="--ubsan"
          fi
          ./scripts/cmake.sh --debug --reflection --${{ matrix.sanitizer }} ${UBSAN_FLAG}
