name: Clang Tidy

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/clang-tidy.yml" # This file
      - "**/*.cc"
      - "**/*.h"
      - "**/CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "**/*.j2"
  # No `paths:` filter here. The `clang-tidy` job is a required status check
  # for merging to main, and a workflow that is filtered out by `paths:` never
  # reports a check, which leaves unrelated pull requests blocked as
  # "Expected - Waiting for status to be reported". Instead, the
  # `detect-changes` job below decides whether the build needs to run, and a
  # job skipped by an `if:` condition counts as a passing check.
  pull_request:
    branches: [main]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug
  # Keep in sync with the clang-tidy package in docker/Dockerfile and the
  # expected version in cmake/modules/FindClangTidy.cmake, so that local runs
  # and CI use the same check set.
  COMPILER_VERSION: 22
  UV_FROZEN: 1

jobs:
  detect-changes:
    # Only pull requests need change detection; pushes to main and scheduled
    # runs always run clang-tidy.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Keep in sync with the `push.paths` list above.
          filters: |
            relevant:
              - ".github/workflows/clang-tidy.yml" # This file
              - "**/*.cc"
              - "**/*.h"
              - "**/CMakeLists.txt"
              - "CMakePresets.json"
              - "cmake/**"
              - "**/*.j2"

  clang-tidy:
    needs: detect-changes
    # Run unless change detection positively reported that nothing relevant
    # changed. `!cancelled()` lets this job run when `detect-changes` was
    # skipped (push and schedule events), and an empty output (because
    # `detect-changes` failed) falls through to running the build rather than
    # silently passing the required check.
    if: ${{ !cancelled() && needs.detect-changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest

    # reviewdog posts review comments on pull requests and check annotations
    # on pushes and scheduled runs.
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@v4.4.2
      - name: Install Clang
        shell: bash
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.COMPILER_VERSION }} all

          # We need to update symlink otherwise we end up with miss matched clang/clang++ and clang-tidy versions.
          sudo rm /usr/bin/clang
          sudo rm /usr/bin/clang++
          sudo rm /usr/bin/clang-tidy

          sudo ln -s /usr/bin/clang-${{ env.COMPILER_VERSION }} /usr/bin/clang
          sudo ln -s /usr/bin/clang++-${{ env.COMPILER_VERSION }} /usr/bin/clang++
          sudo ln -s /usr/bin/clang-tidy-${{ env.COMPILER_VERSION }} /usr/bin/clang-tidy
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Set up Python
        run: uv sync
      - uses: reviewdog/action-setup@v1.5.0
        with:
          reviewdog_version: latest # Optional. [latest,nightly,v.X.Y.Z]
      - name: Build with clang-tidy
        # `shell: bash` enables pipefail, so a clang-tidy failure is not masked
        # by `tee`. WarningsAsErrors in .clang-tidy makes any finding fail
        # the build.
        shell: bash
        run: |
          ./scripts/cmake.sh --debug --clang-tidy 2>&1 | tee build.log
      - name: Report findings with reviewdog
        # Runs even when the build failed so that the findings are annotated.
        if: always()
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            reporter=github-pr-review
          else
            reporter=github-check
          fi
          reviewdog -reporter="$reporter" -name=clang-tidy \
            -efm="%W%f:%l:%c: warning: %m" -efm="%E%f:%l:%c: error: %m" < build.log
