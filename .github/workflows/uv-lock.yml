name: Check uv lockfile

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
  # No `paths:` filter here. This is a required status check for merging to
  # main, but the job is cheap (checkout + `uv lock --check`), so it always
  # runs rather than needing a `detect-changes` job.
  pull_request:
    branches: [main]

# One group per PR, or per ref for pushes and scheduled runs. A new push to a
# PR cancels the runs for its previous head; main and scheduled runs only queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: 1

jobs:
  check-lockfile:
    name: uv-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Check uv lockfile is up to date
        run: uv lock --check
