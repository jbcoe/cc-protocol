codecov:
  notify:
    # Two uploads per commit (runtime and consteval flags); wait for both
    # before comparing against the base, or the first one fails the status.
    after_n_builds: 2

ignore:
  - "*_test.cc"
  - "*_tests.cc"

coverage:
  status:
    # Compare against the pull request's base, tolerating small drift from
    # gcov's per-instantiation counting; a real drop fails the status.
    project:
      default:
        target: auto
        threshold: 1%
