[project]
name = "cc-protocol-dev-tools"
version = "0.1.0"
description = "development support tools for value-types"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "clang-format>=22.1.4",
    "cmake-format>=0.6.13",
    "gcovr>=8.6",
    "pre-commit>=4.2.0",
    "pyrefly>=0.62.0",
    "ruff>=0.15.7",
]

[tool.ruff]
# See https://docs.astral.sh/ruff/rules/.

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",      # Bugbear
    "D",      # Docstrings
    "E",      # Pycodestyle
    "F",      # Pyflakes
    "I",      # Isort
    "W",      # Pycodestyle
]
ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D212",  # multi-line-summary-first-line (conflicts with D213)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
force-single-line = true

[tool.pyrefly]
# scripts/*.py are run directly (e.g. `uv run scripts/bazel.py`), which puts
# scripts/ itself on sys.path, so compiler_discovery.py is imported as a
# top-level module rather than via scripts.compiler_discovery.
search-path = ["scripts"]

[tool.pyrefly.errors]
unannotated-parameter = "error"
unannotated-return = "error"
implicit-any = "error"
